name: Deploy to cPanel Hosting (finance.itec.rw)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Upload File via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.0.0
        with:
          server: ftp.itec.rw
          username: finance@banking.itec.rw
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_api/
          server-dir: /public_html/banking.itec.rw/
          protocol: ftp
          port: 21
          log-level: verbose
          dangerous-clean-slate: true
